name: Build Extension

on:
  push:
    tags: ["v[0-9]+.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension image to build (all extensions on tags)
        type: choice
        options:
          - qemu
          - firecracker
          - cloud-hypervisor
        default: qemu
      tag:
        description: Tag to build (defaults to current commit)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINER_RUNTIME: docker

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        extension: [qemu, firecracker, cloud-hypervisor]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push extension
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.extension == matrix.extension)
        run: just build
        env:
          CONTAINER_RUNTIME: docker
          EXTENSION: ${{ matrix.extension }}
          ARCH: ${{ matrix.arch }}
          PUSH: "true"
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Annotate extension sizes (${{ steps.tag.outputs.tag }})
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.extension == matrix.extension)
        env:
          EXTENSION: ${{ matrix.extension }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ steps.tag.outputs.tag }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just annotate

      - name: Build summary
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.extension == matrix.extension)
        env:
          EXTENSION: ${{ matrix.extension }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "### ${EXTENSION} (${ARCH}) Built" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Tag:** \`${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Image:** \`extensions/${EXTENSION}:${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
