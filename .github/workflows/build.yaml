name: Build Extension

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension to build: qemu, firecracker or cloud-hypervisor (leave empty for all)"
        required: false
        type: string
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

jobs:
  setup:
    name: Resolve extensions
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.matrix.outputs.extensions }}
    steps:
      - name: Resolve extension matrix
        id: matrix
        env:
          SELECTED: ${{ inputs.extension }}
        run: |
          case "${SELECTED}" in
            ""|qemu|firecracker|cloud-hypervisor) ;;
            *)
              echo "Unknown extension '${SELECTED}' (expected qemu, firecracker or cloud-hypervisor)" >&2
              exit 1
              ;;
          esac
          if [[ -z "${SELECTED}" ]]; then
            echo 'extensions=["qemu","firecracker","cloud-hypervisor"]' >> "$GITHUB_OUTPUT"
          else
            echo "extensions=[\"${SELECTED}\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.setup.outputs.extensions) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension (${{ matrix.extension }} ${{ matrix.arch }})
        run: |
          CONTAINER_RUNTIME=docker \
          EXTENSION=${{ matrix.extension }} \
          ARCH=${{ matrix.arch }} \
          PUSH=true \
          TAG=ci-${{ matrix.arch }} \
          just oci

  manifest:
    name: Combine multi-arch manifest
    needs: [build, setup]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.setup.outputs.extensions) }}
    runs-on: ubuntu-latest
    env:
      CONTAINER_RUNTIME: docker
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@just

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest (${{ matrix.extension }} ${{ steps.tag.outputs.tag }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          just merge amd64=ci-amd64 arm64=ci-arm64

      - name: Repack image layers (${{ matrix.extension }} ${{ steps.tag.outputs.tag }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          just repack

      - name: Build summary
        run: |
          echo "### extensions/${{ matrix.extension }} Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`extensions/${{ matrix.extension }}:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
